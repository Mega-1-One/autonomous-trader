version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autotrader_postgres
    restart: always
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: traderpass
      POSTGRES_DB: autotrader_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d autotrader_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autotrader_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autotrader_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://trader:traderpass@postgres:5432/autotrader_db
      - EXECUTION_MODE=PAPER
      - ENABLE_LIVE_TRADING=false
      - LIVE_TRADING_CONFIRMATION=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
