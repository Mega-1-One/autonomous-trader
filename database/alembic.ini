[alembic]
script_location = database/migrations
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = backend

sqlalchemy.url = postgresql+asyncpg://trader:traderpass@localhost:5432/autotrader_db

[post_write_hooks]

[logging]
default_handler = stream

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = stream

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = stream
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_stream]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
