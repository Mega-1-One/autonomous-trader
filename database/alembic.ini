[alembic]
script_location = database/migrations
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = backend

# D-06: no credentials are stored here. Alembic is optional scaffolding; the
# application creates tables via Base.metadata.create_all at startup (see
# README "Database"). When migrations are needed, set DATABASE_URL in the
# environment (migrations/env.py prefers it over this placeholder).
sqlalchemy.url = postgresql+asyncpg://CHANGEME:CHANGEME@localhost:5432/autotrader_db

[post_write_hooks]

[logging]
default_handler = stream

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = stream

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = stream
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_stream]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
