name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # tests/conftest.py defines a session-scoped event_loop fixture,
          # a pattern only supported by pytest-asyncio 0.23.x (removed in 1.x)
          pip install "pytest-asyncio<0.24"

      - name: Run test suite
        run: pytest tests/ -v

      # M-5: API contract diff vs docs/baseline (non-zero exit on drift).
      - name: API contract diff
        run: python ../docs/baseline/contract_diff.py

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: the lint gate must not flip on a new ruff release's rules.
        run: pip install "ruff==0.16.8"

      - name: Ruff check (correctness rules, see pyproject.toml)
        run: ruff check app scripts

  backend-types:
    name: Backend types (mypy, report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Mypy trial (report-only)
        run: mypy app --ignore-missing-imports || true

  compose-smoke:
    name: Compose smoke (build + health)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then exit 0; fi
            sleep 5
          done
          echo "backend never became healthy" >&2
          docker compose logs backend
          exit 1

      - name: Tear down stack
        if: always()
        run: docker compose down

  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No lint step: the frontend has no ESLint config yet (`next lint`
      # would fail asking for interactive setup). `next build` still
      # type-checks, so the build is the quality gate for now.
      - name: Build
        run: npm run build
